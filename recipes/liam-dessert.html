<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESSERT</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <h1>DESSERT</h1>
    <p class="tagline">Lets not waste time, this is a basic dessert.</p>
  </header>
  <main>
    <p class="meta">Added by: Liam</p>
    <h2>Ingredients</h2>
    <ul>
      <li>8 eggs</li>
      <li>2l milk</li>
      <li>500g sugar</li>
    </ul>
    <h2>Steps</h2>
    <ol>
      <li>Crack open all eggs into a bowl and add the milk</li>
      <li>Swirl it while slowly adding the sugar</li>
      <li>Cook in a pot for 20 minutes</li>
    </ol>
    <p><a href="../index.html">Back to all recipes</a></p>
  </main>
</body>
</html>
